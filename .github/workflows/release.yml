name: Release

on:
  workflow_dispatch:
    inputs:
      npm:
        description: "NPM Package"
        required: false
        type: boolean
        default: true
      githubRelease:
        description: "GitHub Release"
        required: false
        type: boolean
        default: true
      version:
        description: "Version for the GitHub release (e.g. 1.2.3)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  npm:
    if: |-
      github.ref == 'refs/heads/main' && (
      inputs.npm
      )
    runs-on: ubuntu-latest
    environment: npmjs-registry
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.20.0 --registry=https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: npm publish --provenance

  githubRelease:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
      statuses: write
    needs: [npm]
    if: |-
      github.ref == 'refs/heads/main' && (
      always() &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'failure') &&
      inputs.githubRelease
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # Needed by the release/push step
      - name: Create GitHub Release
        uses: open-resource-discovery/github-release@70fcf9f5444e0e83420754d19850b06f8831236e # main @ 2026-11-14
        with:
          tag-template: "rel/<version>"
          version: ${{ inputs.version }}
          ci-workflows: main.yml
