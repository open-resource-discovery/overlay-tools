name: Release

on:
    workflow_dispatch:
        inputs:
            npm:
                description: 'NPM Package'
                required: false
                type: boolean
                default: true
            githubRelease:
                description: 'GitHub Release'
                required: false
                type: boolean
                default: true
            version:
                description: 'Version for the GitHub release (e.g. 1.2.3)'
                required: false
                type: string

jobs:
    npm:
        if: inputs.npm
        runs-on: ubuntu-latest
        environment: npmjs-registry
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Publish to NPM
              run: npm publish

    githubRelease:
        needs: [npm]
        if: |
            always() &&
            !contains(needs.*.result, 'cancelled') &&
            !contains(needs.*.result, 'failure') &&
            inputs.githubRelease
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Create GitHub Release
              uses: open-resource-discovery/github-release@9f5caa67652eb07f1c3ee795249fd7729f06d2e7 # main
              with:
                  tag-template: 'rel/<version>'
                  version: ${{ inputs.version }}
                  ci-workflows: main.yml
